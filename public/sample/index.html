<body>
    <div id="phone">
        <div class="header"> </div>
        <div id="spaces" class="content">

        </div>
    </div>

    <div id="controls"></div>
    <div id="network-status" class="loader"></div>
</body>

<script>
    var SERVICE_URL = "https://us-central1-aura-persona.cloudfunctions.net/";
    if (window.location.href.indexOf("localhost") != -1) {
        SERVICE_URL = "http://localhost:5001/aura-persona/us-central1/"
    }

    const colorThief = new ColorThief();

    let root = new Component($("spaces"));
    let controls = new Component($("controls"));

    document.fonts.ready.then(() => {
        listPersona();
        // dofetch(SERVICE_URL + "listObservations1?id=" + Jaime.id + "&date=" + Jaime.date, {}, obs => {
        //     let obsMap = {};
        //     obs.forEach(o => { obsMap[o.id] = o; })
        //     new SpacesComponent($("spaces"), Jaime2, obsMap);
        // });      

    });

    function listPersona() {
        dofetch(SERVICE_URL + "listPersona1", {}, personas => {
            // console.log(personas);
            let personaList = new PersonaListUI(controls);
            personaList.data = personas;
            personaList.addListener('value', persona => {
                dofetch(SERVICE_URL + "listDaysForPersona1?id=" + persona.id, {}, days => {
                    // console.log(days);
                    personaList.visible(false);
                    let personaItem = new Component(controls);
                    let personaHeader = new PersonComponent(personaItem, persona);
                    let obsView = null;
                    personaHeader.back.click(e => {
                        personaList.visible(true);
                        personaItem.remove();
                    });
                    let dayBB = new DayTabs(personaHeader.daysContainer, {}, days);
                    dayBB.addListener("value", day => {
                        showDay(personaItem, persona, day);
                    });
                    if (days.length != 0) {
                        showDay(personaItem, persona, days[0]);
                    }

                });
            });
        });
    }

    let lastObsView = null;
    function showDay(p, persona, day) {
        console.log(persona)
        if (persona.imageBG) {
            let bg = new Image();
            // bg.crossOrigin = 'anonymous';
            bg.src = persona.imageBG;
            bg.onload = ()=>{
                $("phone").style.backgroundImage = "url(" + persona.imageBG + ")";
                let x = colorThief.getPalette(bg);
                console.log(x);
            }
        }
        $("spaces").innerText = "";
        dofetch(SERVICE_URL + "listObservations1?id=" + persona.id + "&date=" + day.date, {}, obs => {
            // console.log(obs);
            if (lastObsView) lastObsView.remove();
            let obsMap = {};
            obs.forEach(o => { obsMap[o.id] = o; })
            let obsView = new ObservationsView(p, obs);
            lastObsView = obsView;
            obsView.gen.addListener("click", e => {
                obsView.gen.visible(false);
                const shortObs = obs.slice(obsView.slider.data.min, obsView.slider.data.max);
                let prompt = processTemplate(S42_ORGANIZE_AND_TRACK, {
                    user: persona.name,
                    // spaces: props.spaces.toString(),
                    observations: JSON.stringify(shortObs),
                    date: day.date.toString()
                });
                callDefaultLLM(prompt, organized => {
                    // console.log(JSON.stringify(organized, null, "  "));
                    obsView.gen.visible(true);
                    console.log(organized)
                    new SpacesComponent($("spaces"), organized.spaces, obsMap);
                });
            });
            obsView.genImg3.addListener("click", e => {
                dofetch(SERVICE_URL + "createBg1?id=" + persona.id, {}, img => {
                    $("phone").style.backgroundImage = "url(" + img.url + ")";
                });
            });
            // obsView.genImg1.addListener("click", e => {
            //     dofetch(SERVICE_URL + "createImg1?id=" + persona.id +
            //         "&date=" + day.date + "&dayPart=morning", {}, img => {
            //             console.log(img)
            //         });
            // });
            // obsView.genImg2.addListener("click", e => {
            //     dofetch(SERVICE_URL + "createImg1?id=" + persona.id +
            //         "&date=" + day.date + "&dayPart=afternoon", {}, img => {
            //             console.log(img)
            //         });
            // });
        });
    }

</script>

</html>
